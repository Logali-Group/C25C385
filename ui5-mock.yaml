# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: com.logaligroup.invoices
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          backend:
            - path: /v2
              url: https://services.odata.org/
              destination: Northwind3
        backend:
          - url: http://s4h22.sap4practice.com:8007
            client: '800'
            authenticationType: BasicAuthentication
            destination: S4HANA22
            path: /sap
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
        excludePatterns:
          - /Component-preload.js
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /v2/northwind/northwind.svc
            metadataPath: ./webapp/localService/northwind_srv/metadata.xml
            mockdataPath: ./webapp/localService/northwind_srv/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/SEPMRA_SO_ANA
            metadataPath: ./webapp/localService/SEPMRA_SO_ANA/metadata.xml
            mockdataPath: ./webapp/localService/SEPMRA_SO_ANA/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/SEPMRA_SO_ANA/SEPMRA_SO_ANA_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='SEPMRA_SO_ANA_ANNO_MDL',Version='0001')/$value/
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
